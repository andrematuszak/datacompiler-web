<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DataCompiler – Document Transcription &amp; Translation</title>
  <meta name="description" content="Upload scans, PDFs and handwritten documents for fast transcription and translation. Get your price and delivery date instantly, before you order.">
  <link rel="canonical" href="https://data-compiler.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DataCompiler">
  <meta property="og:title" content="DataCompiler – Document Transcription &amp; Translation">
  <meta property="og:description" content="Upload scans, PDFs and handwritten documents for fast transcription and translation. Get your price and delivery date instantly, before you order.">
  <meta property="og:url" content="https://data-compiler.com/">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DataCompiler – Document Transcription &amp; Translation">
  <meta name="twitter:description" content="Upload scans, PDFs and handwritten documents for fast transcription and translation.">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"DataCompiler","url":"https://data-compiler.com","email":"contact@data-compiler.com"}
  </script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Source+Serif+4:wght@400;600&display=swap">
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/">DataCompiler</a><nav aria-label="Main navigation"><a href="/pricing.html">Pricing</a><a href="/contact.html">Contact</a><a href="/clients.html">Clients</a><a href="/professionals.html">Professionals</a></nav></div></header>
  <main class="wrap">
    <h1 class="sr-only">Document transcription and translation service</h1>
    <section id="upload-panel" class="upload-panel" aria-label="Upload a document">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose or drop a PDF">
        <strong>Drop a file here</strong><span>or click to upload</span><small hidden>PDF, JPG or PNG</small>
        <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,image/png,image/jpeg" hidden>
      </div>
      <p id="error" class="status warn" hidden role="alert"></p>
    </section>
    <div id="work" class="work" hidden>
      <section class="panel" aria-label="Transcribed document">
        <div id="source-visual" class="visual-frame"></div>
        <h2 id="source-status" class="result-heading"></h2>
        <div class="stats" id="stats"></div>
        <div class="offer-row">
          <label class="target-language"><span>Transcribe to</span><select id="transcribe-format" aria-label="Transcription format"></select></label>
          <a id="transcribe-action" class="action-button" href="/pricing.html"></a>
        </div>
        <p class="delivery-date" id="transcription-delivery"></p>
      </section>
      <section class="panel" aria-label="Translation result">
        <div id="translation-visual" class="visual-frame"></div>
        <h2 id="translation-status" class="result-heading"></h2>
        <div class="stats translation-stats" id="translation-stats"></div>
        <div class="translation-actions">
          <div class="format-controls">
            <label class="target-language"><span>Translate to</span><select id="target-language" aria-label="Translation language"></select></label>
            <label class="target-language"><span>Format</span><select id="translation-format" aria-label="Translation format"></select></label>
          </div>
          <a id="translate-action" class="action-button" href="/pricing.html"></a>
        </div>
        <p class="delivery-date" id="translation-delivery"></p>
      </section>
    </div>
  </main>
  <dialog id="image-zoom" class="image-zoom" aria-label="Enlarged document preview">
    <button id="zoom-close" class="image-zoom-close" type="button" aria-label="Close enlarged preview">×</button>
    <img id="zoom-image" alt="">
  </dialog>
  <footer><div class="wrap"><span>© DataCompiler 2026</span><a href="mailto:contact@data-compiler.com">contact@data-compiler.com</a></div></footer>
  <script src="/app.js"></script>
</body>
</html>
