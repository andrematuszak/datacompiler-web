  <meta name="description" content="Transcription et traduction de documents : PDF, scans, photos et manuscrits. Prix et délai affichés instantanément, relecture humaine des passages incertains.">

  <link rel="alternate" hreflang="fr" href="https://data-compiler.com/fr/">
  <link rel="alternate" hreflang="en" href="https://data-compiler.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DataCompiler">
  <meta property="og:title" content="DataCompiler – Transcription &amp; traduction de documents">
  <meta property="og:description" content="Transcription et traduction de PDF, scans et manuscrits avec prix instantané.">
  <meta property="og:url" content="https://data-compiler.com/fr/">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DataCompiler – Transcription &amp; traduction de documents">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Source+Serif+4&display=swap">
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/fr/">DataCompiler</a><nav aria-label="Navigation principale"><a href="/fr/tarifs.html">Tarifs</a><a href="/fr/guides.html">Guides</a><a href="/contact.html">Contact</a><a href="/clients.html">Clients</a><a href="/professionals.html">Professionals</a><a href="/fr/faq.html">FAQ</a><a href="/" hreflang="en">EN</a></nav></div></header>
  <main class="wrap">
    <h1 class="sr-only">Transcription et traduction de documents en ligne</h1>
    <section class="upload-panel" aria-label="Téléverser un document">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choisir ou déposer un PDF">
        <strong>Déposez un fichier</strong><span>ou cliquez pour téléverser</span><small hidden>PDF, JPG ou PNG</small>
        <input id="file" type="file" hidden>
      </div>
      <p id="error" class="status warn" hidden role="alert"></p>
    </section>
    <section id="work" hidden>
      <div class="work-grid">
        <article class="card preview-card">
          <h2>Transcription</h2>
          <div id="transcription-view"></div>
          <p id="transcription-status" class="status" hidden></p>
        </article>
        <article class="card preview-card">
          <h2>Traduction</h2>
          <div id="translation-view"></div>
          <p id="translation-status" class="status" hidden></p>
        </article>
      </div>
      <div class="actions">
        <button id="order" class="btn" hidden>Commander</button>
        <button id="download" class="btn secondary" hidden>Télécharger</button>
      </div>
    </section>
  </main>
  <footer><div class="wrap">© DataCompiler 2026 · <a href="mailto:contact@data-compiler.com">contact@data-compiler.com</a></div></footer>
  <dialog id="image-zoom"><img id="image-zoom-img" alt=""><form method="dialog"><button class="btn secondary">Fermer</button></form></dialog>
  <script src="/app.js"></script>
</body>
</html>
