# nginx configuration for data-compiler.com — reference copy.
# Live file on the server: /etc/nginx/sites-enabled/<site>.conf
# After editing on the server: nginx -t && systemctl reload nginx
#
# Notes:
# - www -> apex 301 is REQUIRED for SEO (avoids duplicate content).
# - client_max_body_size must exceed the site's MAX_UPLOAD_SIZE (100 MB in app.js).
# - The API proxies to the datacompiler-core uvicorn process on 127.0.0.1:8000.

# ---------------------------------------------------------------------------
# Static website
# ---------------------------------------------------------------------------
server {
    server_name data-compiler.com www.data-compiler.com;
    root /var/www/data-compiler.com;
    index index.html;

    # Canonical host: redirect www -> apex
    if ($host = www.data-compiler.com) {
        return 301 https://data-compiler.com$request_uri;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;   # /clients -> clients.html (clean URLs)
    }

    location = /guides/ {
        try_files /guides.html =404;           # the guides/ folder has no index.html
    }

    location ~ /\.(?!well-known) {
        return 404;                            # never serve .git, .gitignore, ...
    }

    location ~* ^/(README|API_CONTRACT)\.md$ {
        return 404;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/data-compiler.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data-compiler.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS for the website (Certbot-managed block)
server {
    if ($host = www.data-compiler.com) {
        return 301 https://data-compiler.com$request_uri;
    }
    if ($host = data-compiler.com) {
        return 301 https://data-compiler.com$request_uri;
    }

    listen 80;
    server_name data-compiler.com www.data-compiler.com;
    return 404;
}

# ---------------------------------------------------------------------------
# Processing API (datacompiler-core)
# ---------------------------------------------------------------------------
server {
    server_name api.data-compiler.com;
    client_max_body_size 110M;   # must exceed MAX_UPLOAD_SIZE (100 MB) in app.js

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/data-compiler.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data-compiler.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS for the API (Certbot-managed block)
server {
    if ($host = api.data-compiler.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.data-compiler.com;
    return 404;
}
